
name: NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto
        run: |
          unzip -q NOVA-Android.zip -d source

      - name: Compilar NOVA
        run: |
          gradle -p source/NOVA_Android assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: source/NOVA_Android/app/build/outputs/apk/debug/*.apk
